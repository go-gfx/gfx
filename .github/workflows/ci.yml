name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Track the latest stable Go (org convention). go.mod floor is 1.26.4.
jobs:
  # Every file must be gofmt-clean.
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi

  # Build, vet, race-test, and enforce 100% statement coverage on three OSes.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - run: go version
      - run: go vet ./...
      - run: go build ./...
      - name: Test + 100% coverage gate
        shell: bash
        run: |
          COVERPKG=$(go list ./... | paste -sd, -)
          go test -race -coverpkg="$COVERPKG" -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -n 25
          cov=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "coverage: ${cov}%"
          awk -v t="$cov" 'BEGIN { exit !(t+0 >= 100.0) }' || {
            echo "::error::coverage ${cov}% < 100%"; exit 1; }

  # Run the suite on the six supported 64-bit targets. amd64/arm64 run natively;
  # the rest run under qemu-user. This is the per-arch SIMD execution gate: it
  # validates the go-asmgen axpy kernel (amd64 SSE2, arm64 NEON, s390x z/vector)
  # bit-for-bit against the scalar oracle where it ships, and the scalar +
  # multicore fallback on loong64/ppc64le/riscv64 — each run logs which path
  # (HaveSIMD / SIMDName) it exercised.
  arch-native:
    name: arch ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    label: amd64 }
          - { os: ubuntu-24.04-arm, label: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - run: go env GOARCH && go test ./...

  arch-qemu:
    name: arch ${{ matrix.goarch }} (${{ matrix.via }})
    runs-on: ubuntu-latest
    # Only the entries that set `advisory` are allowed to fail; every other
    # lane still gates. Default false, so adding an arch opts IN to gating.
    continue-on-error: ${{ matrix.advisory == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: riscv64, exec: "-exec=qemu-riscv64", via: qemu }
          # ⛔ loong64 IS ADVISORY, AND THE CONDITION IS NOT A VERSION NUMBER.
          #
          # This entry was commented out on 2026-10-06 (issue #70) with the
          # instruction "put it back when Go 1.27.2 ships", because
          # golang/go#81147 -- the 1.27.x backport of the loong64 miscompile
          # golang/go#81000 -- carried milestone Go1.27.2 at the time.
          #
          # go1.27.2 SHIPPED. Measured 2026-10-12:
          #
          #   go1.27.2 published                 yes
          #   golang/go#81147                    still OPEN
          #   its milestone                      moved to Go1.27.3
          #
          # So following that instruction today would have turned the lane red
          # again. A release landing is not the signal; the signal is the
          # BACKPORT closing, and a release published after it.
          #
          # The lane therefore comes back ADVISORY rather than waiting for a
          # version that may slip again: it runs on every push, reports what
          # the toolchain of the day actually does on this package, and blocks
          # nothing. That is the watch -- there is no cron to write, because
          # the lane already answers the question each time the answer can
          # have changed. When it goes green, drop `advisory` and this comment.
          - { goarch: loong64, exec: "-exec=qemu-loongarch64", via: qemu, advisory: true }
          - { goarch: ppc64le, exec: "-exec=qemu-ppc64le", via: qemu }
          - { goarch: s390x,   exec: "-exec=qemu-s390x", via: qemu }
          # 32-bit. Every arch above is 64-bit, and a 32-bit int is where a
          # pixel count that multiplies a width by a height stops fitting.
          # There is no SIMD path for either, so these two are also the only
          # lanes that exercise the scalar fallback.
          # 386 runs with NO emulator: a 386 ELF executes directly on the
          # x86-64 runner. That is not a convenience, it is a correctness
          # requirement. Measured on one commit of go-gfx/gfx, eight identical
          # lanes each:
          #
          #   under qemu-i386                    5 failures out of 8
          #   under qemu-i386, asyncpreemptoff=1 0 out of 8
          #   native on the same runner          0 out of 8
          #   under qemu-arm                     0 out of 8
          #
          # Each failure landed on a DIFFERENT input although the seed is
          # fixed, and the wrong value was a sign flip rather than a rounding
          # difference. qemu-i386 loses the guest's floating-point state across
          # the signal Go delivers for asynchronous preemption. Emulating 386
          # here would buy nothing and cost a lane that goes red at random.
          - { goarch: "386",   exec: "", via: native }
          - { goarch: arm,     exec: "-exec=qemu-arm", via: qemu }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # NOT 'stable'. go1.27.0 miscompiles this package for loong64, and
          # that is established on REAL SILICON, not inferred from qemu: the
          # same test binary cross-compiled from the same commit, run on the
          # cfarm401 LoongArch machine, passes when built with go1.26.4 and
          # fails when built with go1.27.0.
          #
          # The failure is a corrupted slice read. Instrumented on that machine,
          # for the first case of TestSkimageLabToRGBOutOfGamut:
          #
          #   raw floats and quantisation  identical under both toolchains
          #   want[i] read from the slice  [0 0 255]   under go1.27.0
          #   the same literal inline      [184 0 255]  under go1.27.0
          #   want[i] read from the slice  [184 0 255]  under go1.26.4
          #
          # So the arithmetic is fine and the element read is not. Nothing in
          # this repository can fix that; pinning the toolchain keeps the lane
          # meaningful until upstream does.
          #
          # Root cause and fix, both now known -- golang/go#81000. TRUNCDW is
          # declared with a floating-point output while producing an integer,
          # so an int-typed value gets an FP register; a uint8 that inherits
          # one is then spilled with an 8-byte MOVD into a 1-byte slot,
          # destroying its neighbour. CL 820040 wraps the conversions in
          # MOVWfpgp/MOVVfpgp so the integer lands in a GP register.
          #
          # UNPIN when a Go release containing CL 820040 is out: set this back
          # to 'stable' and delete this comment. Verified against that CL --
          # its parent still fails TestSkimageLabToRGBOutOfGamut with
          # [184 0 255], and the whole package passes with it.
          #
          # NOT YET, as of go1.27.1. Checked in the released toolchain rather
          # than inferred from a changelog: CL 820040 wraps the conversions in
          # MOVWfpgp/MOVVfpgp, and 1.27.1's LOONG64.rules still reads
          #
          #   (Cvt64Fto32 ...) => (TRUNCDW ...)
          #
          # byte for byte as 1.26.4 does, with TRUNCDW still declared `reg:
          # fp11` -- an FP output for an integer result, which is the defect
          # itself. Held at 1.26.4 until 2026-10-05; moved to the new fleet
          # floor 1.27.1 then, with the loong64 lane set aside (issue #70)
          # rather than every lane held back.
          go-version: '1.27.3'
      # ⛔ qemu-user, called qemu-<arch>, NOT qemu-user-static and
      # qemu-<arch>-static. From 2026-10-19 ubuntu-latest is Ubuntu 26.04,
      # where qemu-user-static is only a virtual package ("has no installation
      # candidate", exit 100, every qemu lane red before a test ran), and the
      # static binaries ship in qemu-user under names WITHOUT the suffix
      # (Debian's file list: /usr/bin/qemu-riscv64, no -static). Ubuntu 24.04
      # has a qemu-user package with the same names, so this one spelling
      # works on both images while the rollout is under way. The native 386
      # lane needs no emulator and installs none.
      - if: matrix.via == 'qemu'
        run: sudo apt-get update && sudo apt-get install -y qemu-user
      - name: Test under qemu (${{ matrix.goarch }})
        run: GOARCH=${{ matrix.goarch }} go test ${{ matrix.exec }} ./...

  # Verify the committed go-asmgen output (simd_{amd64,arm64,s390x}.s) is in sync
  # with its generator: regenerate from gen.go and fail if the working tree
  # differs, so the SIMD assembly can never silently drift from its source.
  asmgen-sync:
    name: asmgen .s in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: Regenerate SIMD assembly
        # Each gen.go is build-tag 'ignore' and pulls go-asmgen only at generate
        # time (via -mod=mod), so the library keeps a zero-dependency go.mod.
        # go.mod/go.sum are restored afterwards; only the .s is checked.
        run: |
          for a in amd64 arm64 s390x; do
            ( cd resample/asmgen/$a && GOWORK=off GOFLAGS=-mod=mod go run gen.go && mv simd_$a.s ../../ )
          done
          git checkout -- go.mod
          rm -f go.sum
      - name: Fail if generated .s drifted
        run: |
          if ! git diff --exit-code -- resample/'*.s'; then
            echo "::error::committed SIMD .s is out of sync with gen.go — run the asmgen generators"
            exit 1
          fi
